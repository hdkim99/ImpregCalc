name: macOS or GUI issue
description: Report installation, Tkinter, window lifecycle, or backend behavior on macOS.
title: "[macOS/GUI]: "
labels: [macos, gui]
body:
  - type: markdown
    attributes:
      value: "Do not post confidential data. Remove paths or environment values that reveal secrets."
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options: [Apple Silicon, Intel]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: ImpregCalc version
    validations:
      required: true
  - type: input
    id: gui
    attributes:
      label: Tk/Tcl version
      description: Run `python -c "import tkinter; print(tkinter.TkVersion)"`.
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: Installation method
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Full traceback or terminal output
    validations:
      required: true

